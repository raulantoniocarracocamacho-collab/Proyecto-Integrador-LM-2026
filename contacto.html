<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · consulta del usuario
    </title>
    <meta name="description" content="Página de contacto de la pagina de God of War.">
    <meta name="keywords" content="God of War, Dioses nordicos, mitología griega">
  <meta name="author" content="Raúl Antonio Carrasco Camacho">
</head>
<body>
  <header>
    <h1>Contacto</h1>
  </header>
  <main>
    <section>
      <h2>Envíanos tu consulta</h2>
      <form action="#" method="post">
        <fieldset>
          <legend>Tus datos</legend>
          <div>
            <label for="nombre">Nombre de guerrero:</label>
            <input type="text" id="nombre" name="nombre" autofocus required minlength="2" maxlength="30">
          </div>
          <div>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="tu@correo.es" required>
          </div>
          <div>
            <label for="telefono">Teléfono de contacto:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="600000000">
          </div>
        </fieldset>
        <fieldset>
          <legend>Tu consulta</legend>
          <div>
            <label for="juego">Juego del que desea comentar:</label>
            <select id="juego" name="juego">
              <option value="God of War">God of War</option>
              <option value="God of War II">God of War II</option>
              <option value="God of War III">God of War III</option>
              <option value="God of War (2018)">God of War (2018)</option>
              <option value="God of War Ragnarök">God of War Ragnarök</option>
              <option value="otro" selected>otro</option>
            </select>
          </div>
          <div>
            <label>Juega desde:</label>
            <br>
            <input type="radio" id="mit-griega" name="jugado-desde" value="griega" checked>
            <label for="mit-griega">La saga griega</label>
            <input type="radio" id="mit-nordica" name="jugado-desde" value="nordica">
            <label for="mit-nordica">La saga nórdica</label>
            <input type="radio" id="ninguna" name="jugado-desde" value="ninguna">
            <label for="ninguna">No jugué a ningun juego aún</label>
          </div>
          <div>
            <label>¿Que te llamó la atención sobre la saga y te motivó a investigar sobre ella y/o jugarla?</label>
            <br>
            <input type="checkbox" id="historia" name="gusto" value="historia">
            <label for="historia"> Por la interesante historia</label>
            <input type="checkbox" id="combate" name="gusto" value="combate">
            <label for="combate"> Por el epico combate</label>
            <input type="checkbox" id="jugabilidad" name="gusto" value="jugabilidad">
            <label for="jugabilidad"> Por la buena jugabilidad</label>
            <input type="checkbox" id="indeciso" name="gusto" value="indeciso">
            <label for="indeciso"> No estoy seguro</label>
          </div>
          <div>
            <label for="mensaje">Escribe tu mensaje o reporte:</label>
            <br>
            <textarea id="mensaje" name="mensaje" rows="4" cols="40" placeholder="Describe tu consulta aquí..." required minlength="10"></textarea>
          </div>
        </fieldset>
        <div>
          <button type="submit">Enviar consulta</button>
          <button type="reset">Reiniciar</button>
        </div>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; Año 2026. Raúl Antonio Carrasco Camacho</p>
  </footer>
</body>
</html>
